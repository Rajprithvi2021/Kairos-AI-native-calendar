# One-command run:  docker compose -f infra/docker-compose.yml up --build   ->  http://localhost:3000
# Optional: export ANTHROPIC_API_KEY first to enable Claude.
services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      KAIROS_AI_MODE: ${KAIROS_AI_MODE:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KAIROS_DATABASE_URL: sqlite:////data/kairos.db
      KAIROS_CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - kairos-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kairos-data: {}
