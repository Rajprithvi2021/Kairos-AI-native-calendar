[project]
name = "kairos-api"
version = "0.1.0"
description = "Kairos - AI-native calendar for business users (prototype API)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pg8000>=1.31",  # Postgres (Neon) driver, pure Python
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=0.49",
  "tzdata>=2024.1",
  "holidays>=0.55",
  "icalendar>=6.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Live Google Calendar sync (optional; needs your own OAuth client).
google = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "playwright>=1.47",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ"]
ignore = ["E501", "B008"]
