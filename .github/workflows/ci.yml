name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lint
        run: uv run python -m ruff check app tests evals
      - name: Unit, property and API tests
        run: uv run python -m pytest
      - name: NL-command eval gate (offline parser >= 90% action accuracy)
        run: uv run python -m evals.run_evals

  # The same backend suite against Postgres 16 (what Neon runs), through the pg8000 driver used in production.
  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairos
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      KAIROS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairos?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Unit, property and API tests on Postgres
        run: uv run python -m pytest

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26] # 24 is what render.yaml deploys with
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src
      - run: npx vitest run
      - run: npm run build
